es":"26,27"}},{"content":"5: Interface Design (new 2026)","children":[{"content":"Q5: How does AI-generated visualization affect scholars&apos; interpretation of cultural and historical documents, and what frameworks are needed to judge what is gained or lost?","children":[],"payload":{"tag":"h3","lines":"31,32"}},{"content":"Q5a: How can generative AI visualizations show interpretive gaps and contested meanings instead of flattening them?","children":[],"payload":{"tag":"h3","lines":"32,33"}},{"content":"Q5b: How can interfaces present AI outputs as suggestions, not definitive findings, so scholars keep interpretive control?","children":[],"payload":{"tag":"h3","lines":"33,34"}}],"payload":{"tag":"h2","lines":"30,31"}},{"content":"6: Other (new 2026)","children":[{"content":"Q6: How can humanistic and design principles be combined to build tools that genuinely fit humanities research, not just adapt computational models to it?","children":[],"payload":{"tag":"h3","lines":"36,37"}},{"content":"Q6a: How can knowledge graph interfaces support relational and narrative exploration, not just item lookup?","children":[],"payload":{"tag":"h3","lines":"37,38"}},{"content":"Q6b: How can interfaces use semantic standards to connect diverse humanities data without overwhelming scholars with technical complexity?","children":[],"payload":{"tag":"h3","lines":"38,39"}},{"content":"Q6c: How can conversational chat2viz tools be designed for humanities needs&#x2014;like relationship discovery and narrative synthesis&#x2014;instead of generic business-style interfaces?","children":[],"payload":{"tag":"h3","lines":"39,40"}}],"payload":{"tag":"h2","lines":"35,36"}}]},{"colorFreezeLevel":2,"initialExpandLevel":3,"color":["#2980b9"],"maxWidth":440})</script>
